name: Step 2 # Dossier de travail, préparation et commit

on:
  push:
    branches:
      - "feature/robot-status"
    paths:
      - "robot/config.yaml"
  workflow_dispatch:

concurrency:
  group: git-vscode-step-2-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write
  issues: write

env:
  STEP_3_FILE: ".github/steps/3-history-restore-vscode.md"
  TOOLKIT_REPOSITORY: "ENSTARobotics/exercise-toolkit-fr"
  TOOLKIT_REF: "19f8395fee473aca8af74039182a41cdda9ab0e3"

jobs:
  find_exercise:
    if: |
      !github.event.repository.is_template &&
      github.ref_name == 'feature/robot-status'
    name: Retrouver l'Issue de l'exercice
    uses: ENSTARobotics/exercise-toolkit-fr/.github/workflows/find-exercise-issue.yml@19f8395fee473aca8af74039182a41cdda9ab0e3

  check_step_work:
    name: Vérifier le premier commit local
    runs-on: ubuntu-latest
    needs: [find_exercise]
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Récupérer la branche et l'historique
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feature/robot-status
          fetch-depth: 0

      - name: Récupérer les templates français
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ env.TOOLKIT_REPOSITORY }}
          path: exercise-toolkit-fr
          ref: ${{ env.TOOLKIT_REF }}

      - name: Retrouver le dernier commentaire de progression
        id: find-last-comment
        uses: peter-evans/find-comment@3eae4d37986fb5a8592848f6a574fdf654e61f9e # v3
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          direction: last

      - name: Indiquer que le travail est en cours de vérification
        uses: GrantBirki/comment@608e41b19bc973020ec0e189ebfdae935d7fe0cc # v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          file: exercise-toolkit-fr/markdown-templates/step-feedback/checking-work.md
          edit-mode: replace

      - name: Vérifier max_speed
        id: check-config
        continue-on-error: true
        shell: bash
        run: grep -Eq '^[[:space:]]*max_speed:[[:space:]]*0\.8[[:space:]]*$' robot/config.yaml

      - name: Vérifier que robot/config.yaml a été modifié dans un commit
        id: check-commit
        continue-on-error: true
        shell: bash
        run: |
          count="$(git rev-list --count HEAD -- robot/config.yaml)"
          echo "Commits ayant touché robot/config.yaml : $count"
          test "$count" -ge 2

      - name: Publier les résultats
        uses: GrantBirki/comment@608e41b19bc973020ec0e189ebfdae935d7fe0cc # v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          edit-mode: replace
          file: exercise-toolkit-fr/markdown-templates/step-feedback/step-results-table.md
          vars: |
            step_number: 2
            results_table:
              - description: "robot/config.yaml contient max_speed: 0.8"
                passed: ${{ steps.check-config.outcome == 'success' }}
              - description: "robot/config.yaml a été enregistré dans un nouveau commit"
                passed: ${{ steps.check-commit.outcome == 'success' }}

      - name: Arrêter si une vérification échoue
        if: contains(steps.*.outcome, 'failure')
        run: exit 1

  post_next_step_content:
    name: Afficher l'étape 3
    needs: [find_exercise, check_step_work]
    runs-on: ubuntu-latest
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Récupérer le contenu pédagogique depuis main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Récupérer les templates français
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ env.TOOLKIT_REPOSITORY }}
          path: exercise-toolkit-fr
          ref: ${{ env.TOOLKIT_REF }}

      - name: Confirmer l'étape terminée
        uses: GrantBirki/comment@608e41b19bc973020ec0e189ebfdae935d7fe0cc # v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit-fr/markdown-templates/step-feedback/step-finished-prepare-next-step.md
          vars: |
            next_step_number: 3

      - name: Publier l'étape 3
        uses: GrantBirki/comment@608e41b19bc973020ec0e189ebfdae935d7fe0cc # v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.STEP_3_FILE }}

      - name: Indiquer que la progression est surveillée
        uses: GrantBirki/comment@608e41b19bc973020ec0e189ebfdae935d7fe0cc # v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit-fr/markdown-templates/step-feedback/watching-for-progress.md

      - name: Activer l'étape 3 et rattraper un deuxième commit déjà poussé
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          current_state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/2-working-tree-staging-commit.yml" --jq '.state')"
          if [ "$current_state" = "active" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/2-working-tree-staging-commit.yml/disable"
          fi

          next_state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/3-history-restore-vscode.yml" --jq '.state')"
          if [ "$next_state" != "active" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/3-history-restore-vscode.yml/enable"
          fi

          for attempt in {1..10}; do
            next_state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/3-history-restore-vscode.yml" --jq '.state')"
            if [ "$next_state" = "active" ]; then
              break
            fi
            sleep 1
          done

          if [ "$next_state" != "active" ]; then
            echo "Le workflow suivant n'est pas devenu actif à temps."
            exit 1
          fi

          # Laisse à GitHub le temps d'enregistrer un événement déjà parti.
          sleep 2

          if gh api "repos/${GITHUB_REPOSITORY}/contents/.gitignore?ref=feature/robot-status" --jq '.content' > /tmp/gitignore.b64 2>/dev/null; then
            tr -d '\n' < /tmp/gitignore.b64 | base64 -d > /tmp/.gitignore
            if grep -Fxq 'build/' /tmp/.gitignore &&
               grep -Fxq 'install/' /tmp/.gitignore &&
               grep -Fxq 'log/' /tmp/.gitignore &&
               grep -Fxq '__pycache__/' /tmp/.gitignore &&
               grep -Fxq '.venv/' /tmp/.gitignore; then
              config_commit="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/commits" -f sha='feature/robot-status' -f path='robot/config.yaml' -f per_page=1 --jq '.[0].sha // empty')"
              gitignore_commit="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/commits" -f sha='feature/robot-status' -f path='.gitignore' -f per_page=1 --jq '.[0].sha // empty')"

              if [ -n "$config_commit" ] &&
                 [ -n "$gitignore_commit" ] &&
                 [ "$config_commit" != "$gitignore_commit" ]; then
                head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/feature/robot-status" --jq '.object.sha')"
                run_count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/3-history-restore-vscode.yml/runs?branch=feature/robot-status&head_sha=$head_sha&per_page=1" --jq '.total_count')"
                if [ "$run_count" -eq 0 ]; then
                  echo "Le deuxième commit est déjà publié : lancement immédiat de l'étape 3."
                  gh workflow run 3-history-restore-vscode.yml --ref feature/robot-status
                fi
              fi
            fi
          fi
